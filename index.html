<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Água do Pecém</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06161d;--bg2:#0c2a33;--ink:#e8f3f0;--mut:#8fb0b4;--A:#8fd14f;--A2:#c98a3d;--D:#4cc9f0;--D2:#a78bfa;--W:#2ec4d6;--sand:#e9d8a6;color-scheme:dark;font-family:Figtree,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{background:radial-gradient(120% 80% at 50% 0,#0f3a42,var(--bg));padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:.2em 0}
body{transition:background .5s}body[data-t=A]{--acc:var(--A);background:radial-gradient(120% 80% at 50% 0,#245a26,#07170c)}body[data-t=D]{--acc:var(--D);background:radial-gradient(120% 80% at 50% 0,#14507a,#06141f)}
body[data-t] .b{background:var(--acc)}body[data-t] .b.gh{background:#16363f}body[data-t] .b.A{background:var(--A)}body[data-t] .b.D{background:var(--D)}
body[data-t] #tp,body[data-t] #lf,body[data-t] #rt,body[data-t] #lg{border:2px solid var(--acc)}body[data-t=A] aside,body[data-t=A] #tp,body[data-t=A] #lg{background:#10281a}body[data-t=D] aside,body[data-t=D] #tp,body[data-t=D] #lg{background:#0b2438}
.sc{min-height:100vh;padding:20px;animation:fi .4s}@keyframes fi{from{opacity:0}}
.b{font:600 1rem Figtree,sans-serif;color:#041217;background:var(--W);border:0;border-radius:12px;padding:12px 20px;cursor:pointer;margin:4px;transition:transform .15s,filter .15s}
.b:hover{filter:brightness(1.15);transform:translateY(-2px)}.b:active{transform:scale(.96)}.b:disabled{opacity:.4;pointer-events:none}.b:focus-visible,.mc:focus-visible{outline:3px solid #fff}
.b.gh{background:#16363f;color:var(--ink)}.b.big{font-size:1.2rem;padding:16px 28px}.b.A{background:var(--A)}.b.D{background:var(--D)}
.hero{max-width:900px;margin:0 auto;text-align:center}.hero h1{font-size:clamp(2.4rem,8vw,5rem);line-height:.95;letter-spacing:-.02em}
.hero p{max-width:560px;margin:12px auto;color:var(--mut)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:900px;margin:16px auto}
.pn2{border-radius:20px;padding:18px;border:2px solid}.pn2.A{background:#16301a;border-color:var(--A)}.pn2.D{background:#0b2438;border-color:var(--D)}
.cnt{display:flex;align-items:center;gap:12px;font-size:2rem;font-family:'Bricolage Grotesque'}.cnt .b{padding:4px 16px;font-size:1.5rem}
input{width:100%;margin:4px 0;padding:8px 10px;border-radius:8px;border:1px solid #2f5560;background:#0a1f26;color:var(--ink);font:inherit}
.sum{max-width:900px;margin:0 auto;background:#0e2a33;border-radius:16px;padding:14px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.sum b{font-size:1.4rem;display:block;font-family:'Bricolage Grotesque'}
.rules{max-width:760px;margin:0 auto;background:#0e2a33;border-radius:20px;padding:22px;min-height:340px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}.flow span{padding:6px 10px;border-radius:10px;background:#173d47;font-size:.9rem}
.flow .x{background:var(--A2);color:#111}.flow .s{background:var(--sand);color:#111}.flow .v{background:#2d5d9f}
.gm{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;grid-template-areas:"tp tp tp" "lf bd rt" "lg lg lg";gap:10px;max-width:1600px;margin:0 auto;padding:10px;min-height:100vh;align-content:start}
#tp{grid-area:tp;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:#0c2a33;border-radius:16px;padding:10px 14px}#lf{grid-area:lf}#rt{grid-area:rt}.bw{grid-area:bd}
#lg{grid-area:lg;background:#0c2a33;border-radius:16px;padding:8px 14px;max-height:120px;overflow:auto;font-size:.85rem;color:var(--mut)}#lg p{margin:2px 0}
.tm{border-radius:14px;padding:8px 10px;border:2px solid}.tm.A{background:#16301a;border-color:var(--A)}.tm.D{background:#0b2438;border-color:var(--D)}.tm h4,.tm p{margin:2px 0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.ch{font-size:.8rem;padding:2px 8px;border-radius:10px;background:#06161d}
@media(max-width:1000px){.gm{grid-template-columns:1fr;grid-template-areas:"tp" "bd" "rt" "lf" "lg"}#tp{grid-template-columns:1fr}}
.bw{background:linear-gradient(160deg,#0f3d3a,#0a2330);border-radius:20px;padding:6px;border:1px solid #1d5560}
#bd{width:100%;height:auto;display:block}
aside{background:#0c2a33;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tb{padding:10px 12px;border-radius:12px;font-weight:600}.tb.A{background:#27501f}.tb.D{background:#12466a}
.bar{height:12px;border-radius:8px;background:#06161d;overflow:hidden}.bar i{display:block;height:100%;transition:width .5s}
.mc{display:flex;align-items:center;gap:8px;width:100%;margin:3px 0;border-radius:12px;border:2px solid;background:#0a1f26;color:var(--ink);cursor:pointer;padding:4px;font:600 .9rem Figtree}.mc svg{width:60px}
.mc.G,.card.G{border-color:var(--sand)}.mc.A,.card.A{border-color:var(--A)}.mc.D,.card.D{border-color:var(--D)}
.log{font-size:.82rem;color:var(--mut);max-height:130px;overflow:auto}.log p{margin:2px 0}
.mb{position:fixed;inset:0;background:rgba(2,10,14,.8);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:9;padding:12px;animation:fi .25s}.mb.solid{background:#04141a}
.md{background:#0f2f38;border:1px solid #2a6572;border-radius:22px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;animation:pop .3s}@keyframes pop{from{transform:scale(.9)}}
.die{width:84px;height:84px;margin:10px auto;background:#f6f1e3;border-radius:16px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;box-shadow:0 6px 0 #b9ae93}.die i{border-radius:50%;margin:3px}.die i.on{background:#10252b}
.roll{animation:sh .16s infinite}@keyframes sh{50%{transform:rotate(14deg) scale(1.08)}}
.vs{display:flex;justify-content:space-around;align-items:center;gap:6px}.side{flex:1;border-radius:14px;padding:8px;font-weight:600}.side.A{background:#27501f}.side.D{background:#12466a}
.tg{padding:2px 10px;border-radius:20px;font-weight:600;font-size:.9rem}.tg.A{background:var(--A);color:#10210a}.tg.D{background:var(--D);color:#03202b}
.card{border:3px solid;border-radius:18px;padding:12px;background:#0a1f26;text-align:center;margin:6px 0}.card svg{width:150px}
.big{font-size:1.2rem}.hint,p{line-height:1.45}
.rl{display:flex;align-items:center;gap:10px}.rl .die{margin:0;transform:scale(.6);transform-origin:left}
.pw{transition:transform .3s ease;cursor:pointer}.pw.dim{opacity:.35}.pw.mv .tk{filter:drop-shadow(0 0 7px #fff);animation:bob 1s infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.pw.tg .ring{display:block;animation:pl 1s infinite}.ring{display:none}@keyframes pl{50%{r:26;opacity:.4}}
.pw.sel .ring{display:block}.dst{stroke:#fff!important;stroke-width:4!important}
.pa{fill:#8fd14f;stroke:#173d0f;stroke-width:3}.pd{fill:#4cc9f0;stroke:#06304a;stroke-width:3}
.pn{font:800 11px Figtree;text-anchor:middle;fill:#08202a;pointer-events:none}.cb{fill:#2ec4d6;stroke:#fff}.cn{font:800 10px Figtree;text-anchor:middle;fill:#031;pointer-events:none}
.pnum{font:800 9px Figtree;text-anchor:middle;fill:#fff;pointer-events:none}.cl{stroke:#06161d;stroke-width:3}.ct{font:600 9px Figtree;text-anchor:middle;fill:#06161d;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
/* Decisões de regra (ambiguidades):
 - Água inicial = soma das metas das duas equipes. Movimento sempre exato; com vários adversários na casa, o combate é contra um sorteado.
 - Peão pode parar em casa com aliado; combate só ao terminar em casa com adversário.
 - Escudo: ninguém pode terminar movimento sobre peão com escudo; dura até o início do próximo turno do dono.
 - Paralisia: dura o próximo turno da equipe do peão. Energia renovável/Coleta ampliada: consumidas no próximo uso do peão.
 - Memória do território: peão com água na volta vai à base e entrega a carga. Mobilização: avança até 6 casas, parando no reservatório/base.
 - Combate também dá carta se o defensor vencer. CPU não implementada. */
const $=s=>document.querySelector(s),ov=$('#ov'),NS='http://www.w3.org/2000/svg';
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n|0;
const TN={A:'Anacé',D:'Data Center'},OPP=t=>t=='A'?'D':'A',tag=t=>`<span class="tg ${t}">${TN[t]}</span>`;
const seq=(p,n)=>Array.from({length:n},(_,i)=>p+(i+1)),SH=seq('S',6),VS=seq('V',12);
const ROUTE={A:[...seq('A',2),...SH,'R',...VS,...seq('VA',4)],D:[...seq('D',2),...SH,'R',...VS,...seq('VD',4)]};
const cellId=(t,s)=>(s>=1&&s<=25&&s!=9)?ROUTE[t][s-1]:null;
const P={bA:[85,170],bD:[390,470],R:[810,300],A1:[180,170],A2:[285,170],D1:[390,385],D2:[390,280],V1:[815,405],V2:[790,490],V3:[745,550],V12:[115,578],
VD1:[160,530],VD2:[215,505],VD3:[268,490],VD4:[318,478],VA1:[60,500],VA2:[50,420],VA3:[50,340],VA4:[55,260]};
SH.forEach((c,i)=>P[c]=[390+62*i,170]);VS.forEach((c,i)=>{if(i>2&&i<11)P[c]=[680-70*(i-3),585]});
const CARDS={
para:{n:'Paralisação emergencial',c:'G',cat:'Geral',e:'Escolha um peão adversário. Ele não poderá se mover no próximo turno da equipe dele.',w:'Precisa de um peão adversário que ainda não esteja paralisado.'},
esc:{n:'Escudo de proteção',c:'G',cat:'Geral',e:'Escolha um peão aliado. Ele fica imune a combates por uma rodada.',w:'Precisa de um peão aliado sem escudo.'},
rou:{n:'Roubo de água',c:'G',cat:'Geral',e:'Escolha um peão adversário que carrega água. Tire 1 unidade da carga e devolva ao reservatório.',w:'Precisa de um adversário carregando água.'},
mob:{n:'Mobilização popular',c:'A',cat:'Exclusiva do Anacé',e:'Escolha um peão aliado. Ele avança imediatamente 6 casas (para antes, se chegar ao reservatório ou à base).',w:'Precisa de um peão aliado que possa avançar.'},
mem:{n:'Memória do território',c:'A',cat:'Exclusiva do Anacé',e:'Escolha um peão aliado que carrega água na volta. Ele vai direto à base e entrega a carga.',w:'Precisa de um aliado carregando água na rota de volta.'},
ene:{n:'Uso de energia renovável',c:'D',cat:'Exclusiva do DC',e:'Escolha um peão do DC. No próximo movimento dele, o dado vale o dobro.',w:'Precisa de um peão do DC sem este efeito.'},
col:{n:'Coleta ampliada',c:'D',cat:'Exclusiva do DC',e:'Escolha um peão do DC. Na próxima coleta, ele leva o dobro da capacidade normal. Só vale para peões que ainda não chegaram ao reservatório.',w:'Precisa de um peão do DC antes do reservatório (ida ou na base) sem este efeito.'}};
const POOL={A:['para','esc','rou','mob','mem'],D:['para','esc','rou','ene','col']};
const ART={para:'<circle cx="60" cy="45" r="30" fill="none" stroke="#ffb703" stroke-width="6"/><rect x="48" y="30" width="9" height="30" fill="#ffb703"/><rect x="65" y="30" width="9" height="30" fill="#ffb703"/>',
esc:'<path d="M60 8 92 20V46C92 66 76 78 60 84 44 78 28 66 28 46V20Z" fill="#2ec4d6" stroke="#fff" stroke-width="3"/><path d="M60 26C50 42 50 52 60 58 70 52 70 42 60 26Z" fill="#fff"/>',
rou:'<path d="M50 8C32 34 28 48 40 60 48 68 60 68 66 60 76 48 72 34 50 8Z" fill="#2ec4d6"/><path d="M78 30V70M66 58 78 72 90 58" stroke="#ff5d5d" stroke-width="7" fill="none"/>',
mob:'<circle cx="35" cy="32" r="9" fill="#8fd14f"/><circle cx="60" cy="26" r="10" fill="#c98a3d"/><circle cx="85" cy="32" r="9" fill="#8fd14f"/><path d="M20 78C22 52 48 52 50 78M45 80C46 50 74 50 75 80M70 78C72 52 98 52 100 78" fill="#6aa83a"/>',
mem:'<path d="M56 85 58 50 62 85Z" fill="#c98a3d"/><path d="M60 52C20 54 22 14 60 10 98 14 100 54 60 52Z" fill="#8fd14f"/><path d="M60 85C40 86 30 80 22 84M60 85C80 86 90 80 98 84" stroke="#5b8a35" stroke-width="3" fill="none"/>',
ene:'<circle cx="60" cy="45" r="16" fill="#ffd166"/><path d="M60 12V22M60 68V78M27 45H37M83 45H93M37 22 44 29M83 68 76 61M83 22 76 29M37 68 44 61" stroke="#ffd166" stroke-width="5"/><path d="M56 30 50 48H60L56 62 70 42H60L66 30Z" fill="#4cc9f0"/>',
col:'<path d="M42 10C26 36 22 48 32 58 40 66 50 66 54 58 62 48 58 34 42 10Z" fill="#4cc9f0"/><path d="M78 30C62 54 60 66 68 74 76 80 88 78 92 70 98 58 92 48 78 30Z" fill="#2ec4d6"/><path d="M20 78H44M32 66V90" stroke="#fff" stroke-width="5"/>'};
const artS=k=>`<svg viewBox="0 0 120 90">${ART[k]}</svg>`;
const cardF=k=>`<div class="card ${CARDS[k].c}">${artS(k)}<h3>${CARDS[k].n}</h3>${CARDS[k].c=='G'?'<span class="tg" style="background:var(--sand);color:#222">Geral</span>':tag(CARDS[k].c)}<p>${CARDS[k].e}</p></div>`;
const dieH=n=>`<div class="die">${Array.from({length:9},(_,i)=>`<i${[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]][n].includes(i)?' class="on"':''}></i>`).join('')}</div>`;
let S=null,cfg={a:1,d:1,n:{A:[],D:[]},cpu:{A:false,D:false}},ruleI=0;
const scr=h=>{document.body.removeAttribute('data-t');$('#app').innerHTML=`<section class="sc">${h}</section>`};
const btn=id=>new Promise(r=>{$(id).onclick=r});
function modal(h,b,solid){return new Promise(res=>{ov.innerHTML=`<div class="mb ${solid?'solid':''}"><div class="md">${h}<div class="bt">${b.map(x=>`<button class="b ${x.c||''}" data-k="${x.k}" ${x.d?'disabled':''}>${x.t}</button>`).join('')}</div></div></div>`;ov.querySelectorAll('.bt button').forEach(x=>x.onclick=()=>res(x.dataset.k))})}
const closeM=()=>{ov.innerHTML=''};
async function spin(ids,vals){ids.forEach(i=>$(i).classList.add('roll'));for(let j=0;j<9;j++){ids.forEach(i=>$(i).innerHTML=dieH(1+rnd(6)));await sleep(80)}ids.forEach((i,k)=>{$(i).classList.remove('roll');$(i).innerHTML=dieH(vals[k])})}

/* ---------- telas ---------- */
function title(){const sv=localStorage.getItem('pecem');scr(`<div class="hero"><svg viewBox="0 0 800 300" style="width:100%;max-width:800px"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16424d"/><stop offset="1" stop-color="#e08a3c"/></linearGradient></defs><rect width="800" height="300" rx="24" fill="url(#sk)"/><circle cx="400" cy="170" r="60" fill="#ffd166"/>
<g fill="#16301a"><path d="M90 300V150" stroke="#16301a" stroke-width="8"/><path d="M90 150C40 130 20 150 10 170 50 150 70 150 90 150 120 120 160 120 180 140 150 130 120 140 90 150Z"/><path d="M190 300V190" stroke="#16301a" stroke-width="6"/><path d="M190 190C150 170 130 190 120 205 160 188 175 190 190 190 215 165 245 170 260 190 235 180 210 185 190 190Z"/></g>
<g fill="#0b2438" stroke="#4cc9f0" stroke-width="2"><rect x="560" y="90" width="60" height="210"/><rect x="630" y="120" width="60" height="180"/><rect x="700" y="70" width="60" height="230"/></g><g fill="#4cc9f0"><rect x="570" y="110" width="40" height="5"/><rect x="570" y="140" width="40" height="5"/><rect x="640" y="150" width="40" height="5"/><rect x="710" y="100" width="40" height="5"/><rect x="710" y="130" width="40" height="5"/></g>
<path d="M0 250C100 230 200 270 300 250S500 230 800 255V300H0Z" fill="#2ec4d6" opacity=".85"/><path d="M0 275C150 260 300 290 450 272S700 262 800 280V300H0Z" fill="#1c8ea0"/></svg>
<h1>Água do Pecém</h1><p>Anacé e Data Center disputam a mesma água no Complexo do Pecém. Quem leva primeiro a sua meta para casa vence.</p>
<button class="b big" id="st">Nova partida</button>${sv?'<button class="b big D" id="ct">Continuar partida</button>':''}<button class="b gh big" id="rl">Regras</button></div>`);
$('#st').onclick=config;$('#rl').onclick=()=>{ruleI=0;rules()};if(sv)$('#ct').onclick=()=>{S=JSON.parse(sv);S.cpu=S.cpu||{A:0,D:0};S.busy=false;S.tg=null;S.sel=null;buildGame();startTurn(false)}}
function config(){const col=t=>`<div class="pn2 ${t}"><h2>${TN[t]}</h2><input data-t="${t}" placeholder="${cfg.cpu[t]?'Computador':TN[t]}" value="${cfg.n[t][0]||''}" aria-label="Nome ${TN[t]}"><div><button class="b ${cfg.cpu[t]?'gh':t}" data-p="${t}0">Jogador</button><button class="b ${cfg.cpu[t]?t:'gh'}" data-p="${t}1">Computador</button></div><p>3 peões, capacidade ${t=='A'?1:3} por peão, meta de ${t=='A'?5:15} unidades.</p></div>`;
scr(`<div class="hero"><h2>Dois lados, uma água</h2><p>Duas equipes. Um dos lados pode ser o computador.</p></div><div class="cfg">${col('A')}${col('D')}</div><div class="sum"><div><b>3</b>peões por equipe</div><div><b>20</b>unidades no reservatório</div><div><b>5</b>meta Anacé</div><div><b>15</b>meta Data Center</div></div><div class="hero"><button class="b gh" id="bk">Voltar</button><button class="b big" id="go">Começar</button></div>`);
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const t=b.dataset.p[0],c=b.dataset.p[1]=='1';cfg.cpu[t]=c;if(c)cfg.cpu[OPP(t)]=false;config()});
document.querySelectorAll('input').forEach(i=>i.oninput=()=>{cfg.n[i.dataset.t][0]=i.value});$('#bk').onclick=title;$('#go').onclick=()=>{newGame();buildGame();startTurn(false)}}
const RULES=[['Objetivo','Cada equipe leva água do reservatório compartilhado até a própria base. Vence quem entregar primeiro a sua meta.','<div class="flow"><span>Anacé: meta 5</span><span class="v">Data Center: meta 15</span></div>'],
['Equipes e peões','Cada equipe tem 3 peões. Anacé carrega 1 unidade por peão; o Data Center carrega 3. Um dos lados pode ser o computador.','<div class="flow"><span class="x">3 peões Anacé, meta 5</span><span class="v">3 peões DC, meta 15</span></div>'],
['Percurso','São 30 casas. A ida tem 8 casas; a volta tem 16.','<div class="flow"><span>Base</span><span class="x">2 exclusivas</span><span class="s">6 compartilhadas</span><span>Reservatório</span><span class="v">12 compartilhadas</span><span class="x">4 exclusivas</span><span>Base</span></div>'],
['Movimentação','No seu turno, lance o dado, escolha um peão e avance exatamente o valor do dado. Ao chegar ao reservatório ou à base, o movimento termina.',''],
['Coleta','No reservatório o peão coleta até sua capacidade, se houver água. A água só conta para a meta quando chega à base. Peão com carga não coleta de novo.',''],
['Combate','Se o seu peão termina em casa com peão adversário, o combate tem até 3 rounds, cada lado lança o próprio dado e vence quem ganhar 2 rounds. Se houver vários adversários na casa, o combate é contra apenas um deles. Empate repete o round. Quem perde devolve a água ao reservatório e volta à base.',''],
['Power-ups','Quem vence um combate ganha uma carta (máximo 2 na mão). Geral: Paralisação, Escudo, Roubo. Anacé: Mobilização, Memória do território. DC: Energia renovável, Coleta ampliada. Use quando quiser, no seu turno.',''],
['Vitória','A partida acaba na hora em que uma equipe entrega a sua meta. O reservatório começa com a soma das metas das duas equipes.','']];
function rules(){const r=RULES[ruleI];scr(`<div class="rules"><h2>${r[0]}</h2><p>${r[1]}</p>${r[2]}<p style="color:var(--mut)">${ruleI+1} de ${RULES.length}</p><button class="b gh" id="pv" ${ruleI?'':'disabled'}>Anterior</button><button class="b" id="nx">${ruleI<7?'Próxima':'Fechar'}</button></div>`);$('#pv').onclick=()=>{ruleI--;rules()};$('#nx').onclick=()=>{if(ruleI<7){ruleI++;rules()}else title()}}

/* ---------- estado ---------- */
function newGame(){const n=cfg.a+cfg.d,names={};['A','D'].forEach(t=>names[t]=[(cfg.n[t][0]||'').trim()||(cfg.cpu[t]?'Computador':TN[t])]);
S={cpu:{...cfg.cpu},names,water:5*cfg.a+15*cfg.d,w0:5*cfg.a+15*cfg.d,goal:{A:5*cfg.a,D:15*cfg.d},del:{A:0,D:0},pawns:[],turn:Math.random()<.5?'A':'D',idx:{A:0,D:0},phase:'roll',roll:0,hand:{A:[],D:[]},log:['Partida iniciada.'],st:{c:0,w:{A:0,D:0},t:0},won:null,sel:null,tg:null,busy:false};
['A','D'].forEach(t=>{for(let i=0;i<3*cfg[t.toLowerCase()];i++)S.pawns.push({id:t+(i+1),team:t,num:i+1,step:0,carry:0,shield:0,para:0,dobro:0,amp:0})})}
const save=()=>{try{if(S&&!S.won)localStorage.setItem('pecem',JSON.stringify({...S,tg:null,busy:false,sel:null}))}catch(e){}};

else if(k=='mob'){const r=reach(p,6);refresh();await go(p,r[r.length-1].s)}else if(k=='mem'){p.step=26;renderPawns();await sleep(400);await land(p)}
return true}finally{S.busy=pb;refresh()}}
async function openCard(i){if(S.busy||S.tg||S.won||S.cpu[S.turn])return;const t=S.turn,k=S.hand[t][i];if(!k)return;const v=valid(k,t).length,ok=v>0;
const r=await modal(`${cardF(k)}<p><b>Condição:</b> ${CARDS[k].w}</p>${ok?'':'<p style="color:#ffb703">Não pode ser usada agora: nenhum peão válido.</p>'}`,[{k:'u',t:'Usar',c:t,d:!ok},{k:'b',t:'Voltar e guardar',c:'gh'}]);closeM();if(r=='u')await useCard(t,k,i)}
async function reward(t){if(S.won)return;if(S.cpu[t]){if(S.hand[t].length<2){S.hand[t].push(POOL[t][rnd(5)]);log(`${TN[t]} ganhou uma carta.`)}refresh();return}const k=POOL[t][rnd(5)],h=S.hand[t];
for(;;){const now=t==S.turn&&valid(k,t).length>0,full=h.length>=2;
const b=full?[...h.map((c,i)=>({k:'s'+i,t:`Trocar por ${CARDS[c].n}`,c:'gh'})),{k:'d',t:'Descartar a nova',c:'gh'}]:[{k:'g',t:'Guardar na mão'}];if(now)b.unshift({k:'u',t:'Usar agora',c:t});
const r=await modal(`<h3>${TN[t]} ganhou uma carta!</h3>${cardF(k)}<p>${full?'A mão está cheia (2/2). Troque uma carta ou descarte a nova.':'Guarde para usar depois ou use agora.'}</p>`,b);
if(r=='g')h.push(k);else if(r[0]=='s'){h.splice(+r[1],1);h.push(k)}else if(r=='u'){closeM();if(!await useCard(t,k,null))continue}closeM();refresh();return}}

/* ---------- vitória ---------- */
function victory(t){S.won=t;try{localStorage.removeItem('pecem')}catch(e){}closeM();
scr(`<div class="hero"><h1 style="color:var(--${t})">${TN[t]} venceu!</h1><p>${t=='A'?'A água ficou no território.':'A infraestrutura foi abastecida.'}</p><div class="sum"><div><b>${S.del.A} de ${S.goal.A}</b>Anacé</div><div><b>${S.del.D} de ${S.goal.D}</b>Data Center</div><div><b>${S.st.c}</b>combates</div><div><b>${S.st.w.A} x ${S.st.w.D}</b>vitórias Anacé x DC</div><div><b>${S.st.t+1}</b>turnos</div></div><br><button class="b big" id="nw">Nova partida</button></div>`);$('#nw').onclick=()=>{S=null;title()}}
title();
</script></body></html>
